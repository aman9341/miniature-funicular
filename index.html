
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOD APK WORLD</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0b0d12;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#151923;
 padding:20px;
 border-bottom:1px solid #292e3a;
}
.logo{font-size:25px;font-weight:bold;color:#32d583}
.logo span{color:white}
header p{color:#9ca3af;font-size:13px}
.search{
 width:100%;padding:14px;
 border-radius:10px;
 border:1px solid #333b49;
 background:#202632;color:white;
 margin-top:12px;font-size:15px;
}
nav{
 display:flex;gap:10px;
 padding:15px;overflow-x:auto;
}
nav button{
 background:#202632;color:white;
 border:1px solid #343c49;
 padding:10px 16px;border-radius:20px;
 white-space:nowrap;
}
h2{padding:0 15px;font-size:20px}
.apps{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;padding:15px;
}
.card{
 background:#171c26;
 border:1px solid #292f3c;
 border-radius:13px;padding:14px;
}
.app-icon{
 width:55px;height:55px;
 border-radius:13px;
 background:#263b35;
 display:flex;align-items:center;
 justify-content:center;
 font-size:25px;
}
.card h3{font-size:15px;margin-bottom:5px}
.card p{color:#9ca3af;font-size:12px}
.tag{color:#32d583;font-size:11px}
.download{
 display:block;text-align:center;
 background:#20a66a;color:white;
 padding:11px;border-radius:8px;
 text-decoration:none;font-size:13px;
 margin-top:12px;
}
footer{
 text-align:center;padding:25px;
 color:#9299a7;font-size:12px;
}
</style>
</head>
<body>

<header>
 <div class="logo">MOD <span>APK WORLD</span></div>
 <p>Discover Apps & Games</p>
 <input class="search" id="search"
 placeholder="Search your favourite apps..."
 oninput="searchApps()">
</header>

<nav>
 <button onclick="filterApps('All')">All Apps</button>
 <button onclick="filterApps('Normal')">Normal APK</button>
 <button onclick="filterApps('Modified')">Modified APK</button>
 <button onclick="filterApps('Games')">Games</button>
</nav>

<h2>Latest Applications ⚡</h2>

<div class="apps" id="apps">

 <div class="card" data-name="Example App" data-type="Normal">
  <div class="app-icon">📱</div>
  <h3>Example App</h3>
  <span class="tag">Normal APK</span>
  <p>Version 1.0 · Android</p>
  <a class="download" href="#">View Details</a>
 </div>

 <div class="card" data-name="Example Game" data-type="Games">
  <div class="app-icon">🎮</div>
  <h3>Example Game</h3>
  <span class="tag">Games</span>
  <p>Version 1.0 · Android</p>
  <a class="download" href="#">View Details</a>
 </div>

</div>

<footer>
 <h3>MOD APK WORLD</h3>
 <p>Apps · Games · Technology</p>
 <p>© 2026 MOD APK WORLD</p>
</footer>

<script>
function searchApps(){
 let q=document.getElementById('search').value.toLowerCase();
 document.querySelectorAll('.card').forEach(card=>{
  card.style.display=card.dataset.name.toLowerCase().includes(q)?'block':'none';
 });
}
function filterApps(type){
 document.querySelectorAll('.card').forEach(card=>{
  card.style.display=(type==='All'||card.dataset.type===type)?'block':'none';
 });
}
</script>

</body>
</html>
